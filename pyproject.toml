[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isyco-calle"
version = "0.1.0"
description = "ISyCo CALL Bridge - capability-gated phone calls via CALL-E"
requires-python = ">=3.11"
dependencies = ["calle-ai>=0.7.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
isyco-call = "isyco_calle.cli:main"

[tool.setuptools]
packages = ["isyco_calle", "isyco_calle.domain", "isyco_calle.capabilities", "isyco_calle.providers"]